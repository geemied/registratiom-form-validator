<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial; background: white; }
        .container {
            width: 350px; margin: 40px auto;
            padding: 20px; border: 1px solid #ccc;
            background: #fff; border-radius: 6px;
        }
        label { font-weight: bold; }
        input {
            width: 100%; padding: 10px;
            margin: 6px 0 14px;
            border: 1px solid #444; border-radius: 4px;
        }
        #errorMsg { color: red; font-weight: bold; display: none; }
        button {
            width: 100%; padding: 10px;
            background: black; color: white;
            border: none; border-radius: 4px;
            font-size: 16px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    <div id="errorMsg"></div>

    <form onsubmit="return loginUser()">
        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
    </form>

    <p style="text-align:center;margin-top:10px;">
        No account? <a href="registration.html">Register</a>
    </p>
</div>

<script>
    function loginUser() {
        let email = document.getElementById("email").value;
        let pass = document.getElementById("password").value;
        let error = document.getElementById("errorMsg");

        let user = JSON.parse(localStorage.getItem("userData"));

        if (!user) {
            error.style.display = "block";
            error.textContent = "No account found. Please register.";
            return false;
        }

        if (email === user.email && pass === user.password) {
            alert("Login Successful!");
            window.location.href = "dashboard.html";
        } else {
            error.style.display = "block";
            error.textContent = "Incorrect email or password!";
        }

        return false;
    }
</script>

</body>
</html>
